<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Sign_In final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Welcome back</text></g><g><rect x="147" y="96" width="96" height="96" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="155" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Avatar</text><text x="155" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">avatar · 96×96dp</text></g><g><rect x="32" y="232" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Email address</text></g><g><rect x="32" y="320" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Password</text></g><g><rect x="170" y="388" width="188" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="178" y="408" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Forgot password?</text></g><g><rect x="32" y="460" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Sign in</text></g><g><rect x="32" y="652" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="672" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Create account</text></g><g><rect x="32" y="556" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Continue with Google</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g><g id="auth_feedback_state" display="none" data-condition="wrong_password_or_fifth_failure"><rect x="32" y="521" width="326" height="28" rx="7" fill="#3A2850"/><text x="40" y="539" font-family="Tajawal,Arial,sans-serif" font-size="11" fill="#F7F4FF">Wrong password: {remaining} tries · OTP required after 5</text></g></svg>