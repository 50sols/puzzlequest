<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>15_Pause_Menu — approved Q05/Q09/Q10 design states</title><desc>Static design geometry (390×844 content area after SafeArea). Conditional widgets share this SAME existing screen, render only when applicable; SVG groups labeled by visible_when are alternatives, not simultaneously interactive. Full action detail is in DESIGN.json.</desc><rect width="390" height="844" fill="#131030" /><g id="dimmed_gameplay" data-visible-when="default" data-layer="modal_barrier"><rect x="0" y="0" width="390" height="844" rx="0" fill="#18152F" stroke="#655A8A" stroke-width="1" /><text x="8" y="28" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF" /></g><g id="pause_dialog" data-visible-when="default" data-layer="modal_panel"><rect x="24" y="154" width="342" height="542" rx="10" fill="#23134A" stroke="#655A8A" stroke-width="1" /><text x="32" y="182" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Pause</text></g><g id="resume" data-visible-when="pause_menu_main_and_not_shuffle_purchase_confirm" data-layer="modal_content"><rect x="48" y="286" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="314" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Resume</text><desc>Conditional visible: pause_menu_main_and_not_shuffle_purchase_confirm</desc></g><g id="restart" data-visible-when="pause_menu_main_and_not_shuffle_purchase_confirm" data-layer="modal_content"><rect x="48" y="354" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="382" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Restart</text><desc>Conditional visible: pause_menu_main_and_not_shuffle_purchase_confirm</desc></g><g id="shuffle" data-visible-when="pause_menu_main_and_not_shuffle_purchase_confirm" data-layer="modal_content"><rect x="48" y="422" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="450" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Shuffle · owned {count}</text><desc>Conditional visible: pause_menu_main_and_not_shuffle_purchase_confirm</desc></g><g id="settings" data-visible-when="pause_menu_main_and_not_shuffle_purchase_confirm" data-layer="modal_content"><rect x="48" y="490" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="518" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Settings</text><desc>Conditional visible: pause_menu_main_and_not_shuffle_purchase_confirm</desc></g><g id="home" data-visible-when="pause_menu_main_and_not_shuffle_purchase_confirm" data-layer="modal_content"><rect x="48" y="558" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="586" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Village</text><desc>Conditional visible: pause_menu_main_and_not_shuffle_purchase_confirm</desc></g><g id="close" data-visible-when="default" data-layer="modal_content"><rect x="294" y="166" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="302" y="194" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">×</text></g><g id="dialog_title" data-visible-when="default" data-layer="modal_content"><rect x="48" y="194" width="238" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="222" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">PAUSED</text></g><g id="shuffle_confirmation_panel" data-visible-when="pause_shuffle_buy_confirm_only" data-layer="modal_content_over_main" style="display:none"><rect x="36" y="266" width="318" height="280" rx="10" fill="#23134A" stroke="#655A8A" stroke-width="1" /><text x="44" y="294" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Confirm Shuffle purchase · 150 Coins</text></g><g id="confirm_shuffle_purchase" data-visible-when="pause_shuffle_buy_confirm_only" data-layer="modal_content_over_main" style="display:none"><rect x="48" y="398" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="426" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Confirm 150 Coins</text></g><g id="cancel_shuffle_purchase" data-visible-when="pause_shuffle_buy_confirm_only" data-layer="modal_content_over_main" style="display:none"><rect x="48" y="472" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="500" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Cancel</text></g></svg>