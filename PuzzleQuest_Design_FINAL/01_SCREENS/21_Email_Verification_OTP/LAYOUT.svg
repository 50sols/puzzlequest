<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Email_Verification_OTP final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Verify your email</text></g><g><rect x="32" y="296" width="326" height="64" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">6-digit verification code</text></g><g><rect x="32" y="376" width="326" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#F7F4FF">Resend in 60s · Code expires in 10m</text></g><g><rect x="80" y="560" width="230" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="88" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Resend code</text></g><g><rect x="32" y="464" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Verify and continue</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g><g><rect x="32" y="688" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Change email address</text></g></svg>