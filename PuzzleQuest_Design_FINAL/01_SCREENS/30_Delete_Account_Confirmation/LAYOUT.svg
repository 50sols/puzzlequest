<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Delete_Account_Confirmation final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="0" y="0" width="390" height="844" rx="0" fill="#131030" stroke="#655A8A" stroke-width="1"/></g><g><rect x="24" y="210" width="342" height="440" rx="10" fill="#23134A" stroke="#655A8A" stroke-width="1"/></g><g><rect x="48" y="234" width="294" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="56" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Delete account?</text></g><g><rect x="48" y="296" width="294" height="96" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="56" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Your account and progress will be permanently</text><text x="56" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">deleted. This cannot be undone.</text><text x="56" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">delete_explanation · 294×96dp</text></g><g><rect x="48" y="500" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="56" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Delete my account</text></g><g><rect x="48" y="572" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="56" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Cancel</text></g><g><rect x="48" y="416" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="56" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Type DELETE to confirm</text></g></svg>
