<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>13_Show_Full_Image_Rewarded — approved Q05/Q09/Q10 design states</title><desc>Static design geometry (390×844 content area after SafeArea). Conditional widgets share this SAME existing screen, render only when applicable; SVG groups labeled by visible_when are alternatives, not simultaneously interactive. Full action detail is in DESIGN.json.</desc><rect width="390" height="844" fill="#131030" /><g id="dimmed_gameplay" data-visible-when="default" data-layer="modal_barrier"><rect x="0" y="0" width="390" height="844" rx="0" fill="#18152F" stroke="#655A8A" stroke-width="1" /><text x="8" y="28" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF" /></g><g id="dialog" data-visible-when="default" data-layer="modal_panel"><rect x="24" y="100" width="342" height="644" rx="10" fill="#23134A" stroke="#655A8A" stroke-width="1" /><text x="32" y="128" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Full Image options</text></g><g id="full_image_preview" data-visible-when="default" data-layer="modal_content"><rect x="48" y="188" width="294" height="216" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="216" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Locked preview</text></g><g id="use_paid_full_image" data-visible-when="default" data-layer="modal_content"><rect x="48" y="520" width="294" height="52" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="548" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">30s · owned {count}</text></g><g id="watch_rewarded_video" data-visible-when="default" data-layer="modal_content"><rect x="48" y="588" width="294" height="52" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="616" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Rewarded ad · 10s</text></g><g id="cancel" data-visible-when="default" data-layer="modal_content"><rect x="48" y="654" width="294" height="52" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="682" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Cancel</text></g><g id="close" data-visible-when="default" data-layer="modal_content"><rect x="294" y="112" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="302" y="140" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">×</text></g><g id="dialog_title" data-visible-when="default" data-layer="modal_content"><rect x="48" y="130" width="238" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="158" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Choose how to view</text></g><g id="dialog_message" data-visible-when="default" data-layer="modal_content"><rect x="48" y="422" width="294" height="72" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="450" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Use stored 30s OR verified ad 10s</text></g></svg>