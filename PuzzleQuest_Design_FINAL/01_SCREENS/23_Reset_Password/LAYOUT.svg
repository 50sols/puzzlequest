<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Reset_Password final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Set new password</text></g><g><rect x="32" y="256" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Password</text></g><g><rect x="32" y="344" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Confirm password</text></g><g><rect x="32" y="536" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Reset password</text></g><g><rect x="32" y="136" width="326" height="64" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Account recovery code</text></g><g><rect x="32" y="424" width="326" height="64" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#F7F4FF">6–64 characters; no complex rules</text><text x="40" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#F7F4FF">Common passwords are rejected</text></g><g><rect x="32" y="620" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Sign in</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g></svg>