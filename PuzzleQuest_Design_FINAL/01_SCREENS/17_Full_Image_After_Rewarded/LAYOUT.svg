<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>17_Full_Image_After_Rewarded — approved Q05/Q09/Q10 design states</title><desc>Static design geometry (390×844 content area after SafeArea). Conditional widgets share this SAME existing screen, render only when applicable; SVG groups labeled by visible_when are alternatives, not simultaneously interactive. Full action detail is in DESIGN.json.</desc><rect width="390" height="844" fill="#131030" /><g id="dimmed_gameplay" data-visible-when="default" data-layer="modal_barrier"><rect x="0" y="0" width="390" height="844" rx="0" fill="#18152F" stroke="#655A8A" stroke-width="1" /><text x="8" y="28" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF" /></g><g id="dialog" data-visible-when="default" data-layer="modal_panel"><rect x="24" y="120" width="342" height="600" rx="10" fill="#23134A" stroke="#655A8A" stroke-width="1" /><text x="32" y="148" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Full Image preview</text></g><g id="preview_full_scene" data-visible-when="default" data-layer="modal_content"><rect x="48" y="208" width="294" height="294" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="236" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Level master picture</text></g><g id="close_preview" data-visible-when="default" data-layer="modal_content"><rect x="48" y="616" width="294" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1" /><text x="56" y="644" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Back to puzzle</text></g><g id="dialog_title" data-visible-when="default" data-layer="modal_content"><rect x="48" y="144" width="238" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="172" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Full Image</text></g><g id="preview_timer" data-visible-when="default" data-layer="modal_content"><rect x="48" y="526" width="294" height="56" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1" /><text x="56" y="554" font-family="Tajawal,Lato,Arial,sans-serif" font-size="13" fill="#F7F4FF">Remaining {seconds}s</text></g></svg>