<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Leaderboard — Weekly Global only, All-time hidden for V1</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN. First bar is a read-only weekly heading, not tabs; All-time must not be drawn or queried.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="16" y="88" width="358" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Weekly Global</text></g><g><rect x="16" y="160" width="358" height="416" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="24" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Rankings</text><text x="24" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">rank_list · 358×416dp</text></g><g><rect x="16" y="624" width="358" height="88" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="24" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">My rank</text></g><g><rect x="16" y="768" width="358" height="50" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="24" y="788" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Advertisement</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Leaderboard</text></g></svg>
