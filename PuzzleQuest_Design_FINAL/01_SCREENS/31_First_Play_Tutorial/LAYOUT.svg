<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>First_Play_Tutorial final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="32" y="112" width="326" height="56" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">How to solve a puzzle</text></g><g><rect x="32" y="208" width="326" height="208" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Drag, match, snap</text><text x="40" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">tutorial_board · 326×208dp</text></g><g><rect x="32" y="632" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Start puzzle</text></g><g><rect x="32" y="704" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Skip tutorial</text></g><g><rect x="32" y="456" width="326" height="88" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Drag a piece to its correct place to snap it</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g></svg>
