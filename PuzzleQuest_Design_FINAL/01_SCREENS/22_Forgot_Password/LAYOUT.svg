<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Forgot_Password final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Forgot password?</text></g><g><rect x="32" y="392" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Email address</text></g><g><rect x="32" y="496" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Send reset code</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g><g><rect x="32" y="580" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Sign in</text></g></svg>
