<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Guest_Save_Progress final component geometry</title><desc>Design geometry for this existing screen only; not new production artwork. 390x844 content area AFTER external system SafeArea insets. Reflow for other sizes and text scale. Labels use COPY_AR/COPY_EN.</desc><rect width="390" height="844" fill="#131030"/><g><rect x="48" y="168" width="294" height="220" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="56" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Guest progress</text><text x="56" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">guest_progress · 294×220dp</text></g><g><rect x="32" y="416" width="326" height="112" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="40" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Save your progress with an account</text><text x="40" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFB8D6">progress_saved · 326×112dp</text></g><g><rect x="32" y="560" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Create account</text></g><g><rect x="32" y="632" width="326" height="56" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Sign in</text></g><g><rect x="32" y="704" width="326" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="40" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Maybe later</text></g><g><rect x="16" y="16" width="48" height="48" rx="10" fill="#343077" stroke="#BFB8D6" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#F7F4FF">Back</text></g><g><rect x="72" y="16" width="246" height="48" rx="10" fill="#211D47" stroke="#655A8A" stroke-width="1"/><text x="80" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#F7F4FF">Guest Save Progress</text></g><g id="merge_dialog_state" display="none" data-conditional-state="guest_login_to_existing_account" role="alternate_in_screen_state"><rect width="390" height="844" fill="#0C0924" fill-opacity="0.78"/><rect x="24" y="210" width="342" height="406" rx="20" fill="#211D47" stroke="#BFB8D6" stroke-width="1"/><text x="43" y="264" font-family="Tajawal,Arial,sans-serif" font-size="19" fill="#F7F4FF">Merge guest progress</text><text x="43" y="315" font-family="Tajawal,Arial,sans-serif" font-size="13" fill="#F7F4FF">Keep best valid stars and times per level</text><text x="43" y="344" font-family="Tajawal,Arial,sans-serif" font-size="13" fill="#F7F4FF">Unique badges; no duplicated rewards</text><text x="43" y="376" font-family="Tajawal,Arial,sans-serif" font-size="12" fill="#F7F4FF">Guest pending data stays safe until confirmed</text><text x="43" y="410" font-family="Tajawal,Arial,sans-serif" font-size="12" fill="#F7F4FF">Coins: confirmed unspent grants only</text><text x="43" y="465" font-family="Tajawal,Arial,sans-serif" font-size="16" fill="#F7F4FF">Confirm merge</text><text x="43" y="544" font-family="Tajawal,Arial,sans-serif" font-size="14" fill="#F7F4FF">Cancel / Retry on failure</text><rect x="43" y="430" width="304" height="56" rx="12" fill="#246747"/><rect x="43" y="503" width="304" height="56" rx="12" fill="#343077"/></g></svg>