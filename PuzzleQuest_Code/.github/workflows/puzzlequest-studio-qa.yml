name: PuzzleQuest Studio QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r PuzzleQuest_Studio/requirements-dev.txt
      - run: python -m pip install -r PuzzleQuest_Studio/requirements.txt
      - run: cd PuzzleQuest_Studio && python -m pytest -q
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xmlwriter, sqlite3, pdo_sqlite, gd, zip, sodium, openssl
          coverage: none
      - run: cd backend && composer install --no-interaction --prefer-dist
      - run: cd backend && php artisan route:list --path=studio
      - run: cd backend && php artisan test
  archive-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, sodium
      - run: cd backend && composer install --no-dev --no-interaction --prefer-dist
      - run: cd backend && python tools_build_cpanel_setup.py --output /tmp/PuzzleQuest-Setup-smoke.zip
      - run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/PuzzleQuest-Setup-smoke.zip') as z:
              assert z.testzip() is None
              assert 'puzzlequest_app/vendor/autoload.php' in z.namelist()
              assert 'public_html/puzzlequest.50sols.com/install/index.php' in z.namelist()
          PY
      # Fresh installer, prior-version upgrade, real MySQL & recovery gates are NOT covered
      # by this archive-only test. Production release requires independent end-to-end evidence.
